<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Miniflow Logistics Dashboard</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Inter,
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef6ff,
                    #f7f1ff,
                    #eefcff
                );

            color: #142451;

            min-height: 100vh;
        }


        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {

            position: fixed;

            left: 0;
            top: 0;
            bottom: 0;

            width: 245px;

            padding: 18px 14px;

            background:
                linear-gradient(
                    180deg,
                    #10265e,
                    #182d6e 50%,
                    #29206f
                );

            box-shadow:
                8px 0 35px
                rgba(37, 58, 120, 0.22);

            z-index: 100;

            overflow-y: auto;
        }


        .logo {

            display: flex;

            align-items: center;

            gap: 12px;

            padding:
                8px 10px 22px;

            margin-bottom: 18px;

            color: white;

            border-bottom:
                1px solid
                rgba(255,255,255,.12);
        }


        .logo-icon {

            width: 48px;
            height: 48px;

            border-radius: 15px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 26px;

            background:
                linear-gradient(
                    135deg,
                    #22d3ee,
                    #6366f1,
                    #a855f7
                );

            box-shadow:
                0 10px 25px
                rgba(99,102,241,.45);
        }


        .logo-text {

            font-size: 22px;

            font-weight: 800;
        }


        .logo-sub {

            font-size: 10px;

            color:
                rgba(255,255,255,.58);

            margin-top: 3px;
        }


        .menu-title {

            color:
                rgba(255,255,255,.40);

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 1.5px;

            padding: 8px 13px;

            margin-top: 8px;
        }


        .menu-item {

            display: flex;

            align-items: center;

            gap: 13px;

            color:
                rgba(255,255,255,.78);

            padding: 12px 14px;

            margin: 5px 0;

            border-radius: 12px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 600;

            transition: .25s;

            position: relative;
        }


        .menu-item:hover {

            color: white;

            background:
                rgba(255,255,255,.10);

            transform:
                translateX(3px);
        }


        .menu-item.active {

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #139bf4,
                    #6945f4
                );

            box-shadow:
                0 10px 24px
                rgba(71,84,240,.35);
        }


        .menu-item.active::before {

            content: "";

            position: absolute;

            left: -14px;

            width: 4px;

            height: 25px;

            border-radius:
                0 5px 5px 0;

            background: #67e8f9;
        }


        .menu-icon {

            width: 27px;

            text-align: center;

            font-size: 18px;
        }


        /* =========================
           MAIN
        ========================= */

        .main {

            margin-left: 245px;

            width:
                calc(100% - 245px);

            min-height: 100vh;

            padding:
                20px 25px 40px;
        }


        /* =========================
           TOP HEADER
        ========================= */

        .topbar {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 20px;

            margin-bottom: 18px;
        }


        .search-box {

            width: 420px;

            max-width: 40vw;

            height: 45px;

            display: flex;

            align-items: center;

            gap: 10px;

            padding: 0 15px;

            background:
                rgba(255,255,255,.88);

            border:
                1px solid
                rgba(255,255,255,.95);

            border-radius: 14px;

            box-shadow:
                0 10px 30px
                rgba(45,65,120,.08);
        }


        .search-box input {

            width: 100%;

            border: none;

            outline: none;

            background: transparent;

            font-size: 13px;
        }


        .header-actions {

            display: flex;

            align-items: center;

            gap: 7px;

            margin-left: auto;
        }


        .header-action {

            height: 38px;

            border: none;

            border-radius: 10px;

            padding: 0 11px;

            display: flex;

            align-items: center;

            gap: 5px;

            color: white;

            cursor: pointer;

            font-size: 10px;

            transition: .2s;
        }


        .header-action:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 18px
                rgba(40,60,120,.18);
        }


        .header-create {

            background:
                linear-gradient(
                    135deg,
                    #0ea5e9,
                    #2563eb
                );
        }


        .header-shipments {

            background:
                linear-gradient(
                    135deg,
                    #10b981,
                    #059669
                );
        }


        .header-track {

            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #6366f1
                );
        }


        .header-ndr {

            background:
                linear-gradient(
                    135deg,
                    #f59e0b,
                    #f97316
                );
        }


        .notification {

            width: 42px;

            height: 42px;

            border-radius: 50%;

            background: white;

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;

            box-shadow:
                0 8px 25px
                rgba(30,50,100,.10);

            font-size: 18px;
        }


        .notification-count {

            position: absolute;

            right: -2px;

            top: -2px;

            width: 18px;

            height: 18px;

            border-radius: 50%;

            background: #ef4444;

            color: white;

            font-size: 9px;

            font-weight: 800;

            display: flex;

            align-items: center;

            justify-content: center;

            border: 2px solid white;
        }


        .profile {

            display: flex;

            align-items: center;

            gap: 9px;

            padding: 4px 10px 4px 4px;

            background: white;

            border-radius: 30px;

            box-shadow:
                0 8px 25px
                rgba(30,50,100,.09);
        }


        .profile-avatar {

            width: 37px;

            height: 37px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            color: white;

            font-weight: 800;

            background:
                linear-gradient(
                    135deg,
                    #fbbf24,
                    #f97316
                );
        }


        .profile-name {

            font-size: 12px;

            font-weight: 800;
        }


        .profile-role {

            font-size: 9px;

            color: #71809c;
        }


        /* =========================
           HERO
        ========================= */

        .hero {

            min-height: 175px;

            border-radius: 25px;

            padding: 28px 40px;

            display: flex;

            align-items: center;

            position: relative;

            overflow: hidden;

            background:
                linear-gradient(
                    120deg,
                    #b8ddff,
                    #d8ecff 38%,
                    #f1e1ff 72%,
                    #ffe6ef
                );

            box-shadow:
                0 18px 45px
                rgba(80,100,160,.14);
        }


        .hero::after {

            content:
                "🚚   📦   📍";

            position: absolute;

            right: 35px;

            bottom: 20px;

            font-size: 55px;

            opacity: .80;
        }


        .hero-content {

            position: relative;

            z-index: 2;

            max-width: 65%;
        }


        .hero h1 {

            margin: 0;

            font-size: 31px;

            color: #10275c;

            letter-spacing: -1px;
        }


        .hero p {

            margin:
                10px 0 0;

            font-size: 14px;

            color: #40577d;
        }


        .hero-tag {

            display: inline-block;

            margin-top: 15px;

            padding: 7px 13px;

            border-radius: 30px;

            background:
                rgba(255,255,255,.65);

            color: #2453b5;

            font-size: 10px;

            font-weight: 800;
        }


        /* =========================
           KPI CARDS
        ========================= */

        .kpi-grid {

            display: grid;

            grid-template-columns:
                repeat(5,1fr);

            gap: 14px;

            margin-top: 18px;
        }


        .kpi {

            min-height: 115px;

            padding: 18px;

            border-radius: 18px;

            color: white;

            position: relative;

            overflow: hidden;

            box-shadow:
                0 15px 30px
                rgba(50,70,120,.16);

            transition: .25s;
        }


        .kpi:hover {

            transform:
                translateY(-5px);

            box-shadow:
                0 24px 45px
                rgba(40,60,120,.22);
        }


        .kpi::after {

            content: "";

            position: absolute;

            width: 100px;

            height: 100px;

            border-radius: 50%;

            right: -35px;

            bottom: -45px;

            background:
                rgba(255,255,255,.15);
        }


        .kpi-blue {

            background:
                linear-gradient(
                    135deg,
                    #0ea5e9,
                    #2563eb
                );
        }


        .kpi-green {

            background:
                linear-gradient(
                    135deg,
                    #10b981,
                    #06b6a4
                );
        }


        .kpi-orange {

            background:
                linear-gradient(
                    135deg,
                    #f59e0b,
                    #f97316
                );
        }


        .kpi-red {

            background:
                linear-gradient(
                    135deg,
                    #fb4f68,
                    #ef4444
                );
        }


        .kpi-purple {

            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #6366f1
                );
        }


        .kpi-top {

            display: flex;

            align-items: center;

            gap: 9px;
        }


        .kpi-icon {

            width: 41px;

            height: 41px;

            border-radius: 50%;

            background:
                rgba(255,255,255,.18);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 20px;
        }


        .kpi-title {

            font-size: 11px;

            font-weight: 600;
        }


        .kpi-value {

            font-size: 27px;

            font-weight: 850;

            margin-top: 9px;
        }


        .kpi-change {

            font-size: 9px;

            margin-top: 3px;

            opacity: .90;
        }


        /* =========================
           DASHBOARD CARDS
        ========================= */

        .dashboard-grid {

            display: grid;

            grid-template-columns:
                1.45fr 1fr .95fr;

            gap: 16px;

            margin-top: 18px;
        }


        .card,
        .panel {

            background:
                rgba(255,255,255,.91);

            border:
                1px solid
                rgba(255,255,255,.95);

            border-radius: 19px;

            box-shadow:
                0 12px 35px
                rgba(43,65,120,.09);

            padding: 19px;
        }


        .card-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 17px;
        }


        .card-title {

            font-size: 16px;

            font-weight: 800;
        }


        .select-small {

            border:
                1px solid #dbe3f2;

            background: white;

            border-radius: 9px;

            padding: 7px 9px;

            font-size: 10px;
        }


        /* =========================
           CHART
        ========================= */

        .chart-area {

            height: 235px;

            display: flex;

            align-items: flex-end;

            gap: 14px;

            padding:
                10px 8px 35px;

            position: relative;

            border-bottom:
                1px solid #e7edf7;
        }


        .chart-grid-lines {

            position: absolute;

            left: 0;
            right: 0;

            top: 25px;
            bottom: 40px;

            background:
                repeating-linear-gradient(
                    to bottom,
                    transparent 0,
                    transparent 45px,
                    #edf2fa 46px
                );
        }


        .chart-column {

            flex: 1;

            height: 100%;

            display: flex;

            align-items: flex-end;

            justify-content: center;

            position: relative;

            z-index: 2;
        }


        .bar-group {

            width: 65%;

            height: 100%;

            display: flex;

            flex-direction: column;

            justify-content: flex-end;

            gap: 2px;
        }


        .bar {

            width: 100%;

            border-radius:
                6px 6px 2px 2px;

            min-height: 4px;
        }


        .bar-blue {

            background:
                linear-gradient(
                    180deg,
                    #60a5fa,
                    #2563eb
                );
        }


        .bar-green {

            background:
                linear-gradient(
                    180deg,
                    #34d399,
                    #10b981
                );
        }


        .bar-orange {

            background:
                linear-gradient(
                    180deg,
                    #fbbf24,
                    #f97316
                );
        }


        .chart-label {

            position: absolute;

            bottom: -27px;

            font-size: 10px;

            color: #7585a0;
        }


        .legend {

            display: flex;

            gap: 13px;

            margin-top: 17px;

            font-size: 9px;

            color: #657691;

            flex-wrap: wrap;
        }


        .legend-item {

            display: flex;

            align-items: center;

            gap: 5px;
        }


        .legend-dot {

            width: 8px;

            height: 8px;

            border-radius: 50%;
        }


        /* =========================
           REGION
        ========================= */

        .region-map {

            height: 235px;

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;
        }


        .india-shape {

            font-size: 115px;

            filter:
                drop-shadow(
                    8px 15px 12px
                    rgba(65,80,150,.16)
                );
        }


        .region-label {

            position: absolute;

            padding: 7px 10px;

            border-radius: 10px;

            background: white;

            box-shadow:
                0 8px 20px
                rgba(50,70,120,.12);

            font-size: 9px;

            font-weight: 700;
        }


        .region-label strong {

            display: block;

            font-size: 13px;

            margin-top: 2px;
        }


        .north {

            top: 12px;

            left: 5px;

            color: #2563eb;
        }


        .west {

            left: 0;

            bottom: 40px;

            color: #f59e0b;
        }


        .east {

            right: 3px;

            top: 70px;

            color: #7c3aed;
        }


        .south {

            bottom: 5px;

            left: 50%;

            transform:
                translateX(-50%);

            color: #ef4444;
        }


        /* =========================
           CARRIER
        ========================= */

        .carrier-row {

            margin-bottom: 17px;
        }


        .carrier-head {

            display: flex;

            justify-content: space-between;

            margin-bottom: 7px;

            font-size: 10px;
        }


        .carrier-name {

            display: flex;

            align-items: center;

            gap: 7px;

            font-weight: 700;
        }


        .carrier-logo {

            width: 25px;

            height: 25px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 7px;

            background: #eff6ff;
        }


        .progress {

            height: 8px;

            background: #e8edf6;

            border-radius: 10px;

            overflow: hidden;
        }


        .progress-bar {

            height: 100%;

            border-radius: 10px;
        }


        .progress-blue {
            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #38bdf8
                );
        }


        .progress-green {
            background:
                linear-gradient(
                    90deg,
                    #10b981,
                    #2dd4bf
                );
        }


        .progress-orange {
            background:
                linear-gradient(
                    90deg,
                    #f97316,
                    #fbbf24
                );
        }


        .progress-purple {
            background:
                linear-gradient(
                    90deg,
                    #7c3aed,
                    #a78bfa
                );
        }


        .progress-red {
            background:
                linear-gradient(
                    90deg,
                    #ef4444,
                    #fb7185
                );
        }


        /* =========================
           LOWER SECTION
        ========================= */

        .lower-grid {

            display: grid;

            grid-template-columns:
                1fr 330px;

            gap: 16px;

            margin-top: 16px;
        }


        .shipment-table {

            width: 100%;

            border-collapse:
                collapse;

            font-size: 10px;
        }


        .shipment-table th {

            text-align: left;

            padding: 11px 9px;

            background: #f6f9ff;

            color: #71809c;

            border-bottom:
                1px solid #e7edf7;
        }


        .shipment-table td {

            padding: 12px 9px;

            border-bottom:
                1px solid #edf1f7;

            color: #405276;
        }


        .shipment-table tr:hover td {

            background: #f8fbff;
        }


        .awb {

            color: #2858c7;

            font-weight: 800;
        }


        /* =========================
           STATUS
        ========================= */

        .status {

            display: inline-block;

            padding:
                5px 9px;

            border-radius: 30px;

            font-size: 9px;

            font-weight: 800;

            background:
                #e0f2fe;

            color:
                #0369a1;
        }


        .status-delivered {

            background: #dcfce7;

            color: #15803d;
        }


        .status-ndr {

            background: #ffedd5;

            color: #c2410c;
        }


        .status-rto {

            background: #ffe4e6;

            color: #be123c;
        }


        .status-retry {

            background: #ede9fe;

            color: #6d28d9;
        }


        .view-button {

            color: #315fd0;

            cursor: pointer;

            font-weight: 700;
        }


        /* =========================
           NOTIFICATIONS
        ========================= */

        .notification-row {

            display: flex;

            align-items: center;

            gap: 10px;

            padding: 11px 0;

            border-bottom:
                1px solid #edf1f7;
        }


        .notice-icon {

            width: 32px;

            height: 32px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .notice-red {
            background: #ffe4e6;
        }


        .notice-blue {
            background: #e0f2fe;
        }


        .notice-green {
            background: #dcfce7;
        }


        .notice-purple {
            background: #ede9fe;
        }


        .notice-orange {
            background: #ffedd5;
        }


        .notice-text {

            flex: 1;

            font-size: 10px;

            color: #50617e;

            line-height: 1.4;
        }


        .notice-time {

            font-size: 9px;

            color: #94a3b8;
        }


        /* =========================
           COMMON PAGES
        ========================= */

        .page-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 25px;
        }


        .page-header h1 {

            margin: 0 0 6px;

            font-size: 28px;

            color: #0f172a;
        }


        .page-header p {

            margin: 0;

            color: #64748b;
        }


        .stats-grid {

            display: grid;

            grid-template-columns:
                repeat(4,1fr);

            gap: 18px;

            margin-bottom: 25px;
        }


        .stat-card {

            background: white;

            border:
                1px solid #e2e8f0;

            border-radius: 12px;

            padding: 20px;

            box-shadow:
                0 5px 20px
                rgba(15,23,42,.05);
        }


        .stat-label {

            color: #64748b;

            font-size: 13px;

            margin-bottom: 8px;
        }


        .stat-value {

            font-size: 27px;

            font-weight: 800;

            color: #0f172a;
        }


        .form-grid {

            display: grid;

            grid-template-columns:
                repeat(2,1fr);

            gap: 18px;
        }


        .field {

            display: flex;

            flex-direction: column;

            gap: 7px;
        }


        .field label {

            font-size: 13px;

            font-weight: 600;

            color: #334155;
        }


        .field input,
        .field select,
        .field textarea {

            width: 100%;

            padding:
                11px 12px;

            border:
                1px solid #cbd5e1;

            border-radius: 8px;

            background: white;

            color: #0f172a;

            outline: none;
        }


        .field input:focus,
        .field select:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37,99,235,.10);
        }


        .primary-button {

            border: none;

            background: #2563eb;

            color: white;

            padding:
                10px 15px;

            border-radius: 8px;

            font-weight: 700;

            cursor: pointer;
        }


        .secondary-button {

            border:
                1px solid #cbd5e1;

            background: white;

            color: #334155;

            padding:
                10px 15px;

            border-radius: 8px;

            font-weight: 700;

            cursor: pointer;
        }


        .danger-button {

            border: none;

            background: #dc2626;

            color: white;

            padding:
                10px 15px;

            border-radius: 8px;

            font-weight: 700;

            cursor: pointer;
        }


        .action-button {

            border:
                1px solid #cbd5e1;

            background: white;

            color: #334155;

            padding:
                8px 11px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 12px;
        }


        .data-table {

            width: 100%;

            border-collapse:
                collapse;

            font-size: 13px;
        }


        .data-table th {

            text-align: left;

            padding: 13px 12px;

            background: #f8fafc;

            color: #475569;

            border-bottom:
                1px solid #e2e8f0;
        }


        .data-table td {

            padding: 13px 12px;

            border-bottom:
                1px solid #e2e8f0;

            color: #334155;
        }


        .empty-state {

            text-align: center;

            padding: 35px;

            color: #64748b;
        }


        .footer {

            text-align: center;

            margin-top: 28px;

            color: #8492ab;

            font-size: 10px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width:1200px) {

            .kpi-grid {

                grid-template-columns:
                    repeat(3,1fr);
            }


            .dashboard-grid {

                grid-template-columns:
                    1fr 1fr;
            }

        }


        @media(max-width:900px) {

            .sidebar {

                width: 75px;
            }


            .logo-text,
            .logo-sub,
            .menu-item span,
            .menu-title {

                display: none;
            }


            .logo {

                justify-content: center;
            }


            .menu-item {

                justify-content: center;
            }


            .main {

                margin-left: 75px;

                width:
                    calc(100% - 75px);
            }


            .lower-grid {

                grid-template-columns: 1fr;
            }

        }


        @media(max-width:650px) {

            .main {

                padding: 12px;
            }


            .topbar {

                flex-wrap: wrap;
            }


            .search-box {

                width: 100%;

                max-width: 100%;
            }


            .header-actions {

                width: 100%;

                justify-content: flex-end;
            }


            .hero {

                padding: 25px;
            }


            .hero-content {

                max-width: 100%;
            }


            .hero::after {

                opacity: .15;
            }


            .kpi-grid {

                grid-template-columns:
                    1fr 1fr;
            }


            .dashboard-grid {

                grid-template-columns: 1fr;
            }


            .form-grid {

                grid-template-columns: 1fr;
            }


            .stats-grid {

                grid-template-columns:
                    1fr 1fr;
            }

        }

    </style>

</head>
